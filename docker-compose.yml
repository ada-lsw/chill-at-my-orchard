services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data          # cached CIMIS data survives rebuilds and works offline
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
